name: Update recent event values

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch StarPets and AMVGG values
        run: python scripts/update_recent_values.py
      - name: Commit updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent-values.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh recent event values"
          git push
